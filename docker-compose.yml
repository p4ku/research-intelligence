version: '3.8'

services:
  # Database with pgvector extension support for RAG
  db:
    image: pgvector/pgvector:pg16
    container_name: ri_postgres
    restart: always
    environment:
      POSTGRES_DB: research_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: development_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache and Celery task broker
  redis:
    image: redis:7-alpine
    container_name: ri_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local S3 replacement for storing original PDFs and Markdown files
  minio:
    image: minio/minio
    container_name: ri_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_dev_user
      MINIO_ROOT_PASSWORD: minio_dev_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ri_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev_secret_key_12345
      - DB_HOST=db
      - DB_NAME=research_intelligence
      - DB_USER=postgres
      - DB_PASSWORD=development_password
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_AGENT_API_KEY=your_google_agent_api_key_here
      - GOOGLE_AGENT_API_URL=https://api.schwarzdigits.cloud/v1/google-agents
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio_dev_user
      - MINIO_SECRET_KEY=minio_dev_password
      - MINIO_SECURE=False
      - SENTRY_DSN=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Celery Async Pipeline Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ri_celery_worker
    restart: always
    command: celery -A django_project worker --loglevel=info -Q tenant-default,tenant-bulk-scraping
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=dev_secret_key_12345
      - DB_HOST=db
      - DB_NAME=research_intelligence
      - DB_USER=postgres
      - DB_PASSWORD=development_password
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_AGENT_API_KEY=your_google_agent_api_key_here
      - GOOGLE_AGENT_API_URL=https://api.schwarzdigits.cloud/v1/google-agents
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio_dev_user
      - MINIO_SECRET_KEY=minio_dev_password
      - MINIO_SECURE=False
      - SENTRY_DSN=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Celery Scheduler (e.g. for trigger weekly executive briefings, checking daily quotas)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ri_celery_beat
    restart: always
    command: celery -A django_project beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=dev_secret_key_12345
      - DB_HOST=db
      - DB_NAME=research_intelligence
      - DB_USER=postgres
      - DB_PASSWORD=development_password
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio_dev_user
      - MINIO_SECRET_KEY=minio_dev_password
      - MINIO_SECURE=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ri_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
