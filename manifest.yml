---
applications:
  - name: sri-api
    docker:
      image: ((backend_image))
    instances: 2
    memory: 1G
    routes:
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/api
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/admin
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/static
    env:
      DEBUG: "False"
      ALLOWED_HOSTS: "sri-prod.apps.01.cf.eu01.onstackit.cloud,sri.soinventive.co.uk,localhost"
      CSRF_TRUSTED_ORIGINS: "https://sri-prod.apps.01.cf.eu01.onstackit.cloud,https://sri.soinventive.co.uk"

  - name: sri-mcp
    docker:
      image: ((backend_image))
    instances: 1
    memory: 512M
    routes:
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/sse
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/messages
    command: python research_intelligence/mcp/server.py

  - name: sri-worker
    docker:
      image: ((backend_image))
    instances: 2
    memory: 1G
    no-route: true
    health-check-type: process
    command: celery -A django_project worker --loglevel=info -Q celery,tenant-default,tenant-bulk-scraping

  - name: sri-beat
    docker:
      image: ((backend_image))
    instances: 1
    memory: 512M
    no-route: true
    health-check-type: process
    command: celery -A django_project beat --loglevel=info

  - name: sri-frontend
    docker:
      image: ((frontend_image))
    instances: 2
    memory: 512M
    routes:
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud



