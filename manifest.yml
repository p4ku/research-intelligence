---
applications:
  - name: sri-api
    docker:
      image: ((backend_image))
      username: ((registry_username))
    instances: 2
    memory: 512M
    disk_quota: 1G
    routes:
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/api
      - route: forschungsintelligenz.com/api
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/mcp
      - route: forschungsintelligenz.com/mcp
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/metrics
      - route: forschungsintelligenz.com/metrics
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/health
      - route: forschungsintelligenz.com/health
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/admin
      - route: forschungsintelligenz.com/admin
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/docs
      - route: forschungsintelligenz.com/docs
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/swagger
      - route: forschungsintelligenz.com/swagger
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/redoc
      - route: forschungsintelligenz.com/redoc
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/schema
      - route: forschungsintelligenz.com/schema
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/static
      - route: forschungsintelligenz.com/static
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/media
      - route: forschungsintelligenz.com/media

    env:
      DEBUG: "False"
      ALLOWED_HOSTS: "sri-prod.apps.01.cf.eu01.onstackit.cloud,forschungsintelligenz.com,sri.soinventive.co.uk,localhost"
      CSRF_TRUSTED_ORIGINS: "https://sri-prod.apps.01.cf.eu01.onstackit.cloud,https://forschungsintelligenz.com,https://sri.soinventive.co.uk"

  - name: sri-mcp
    docker:
      image: ((backend_image))
      username: ((registry_username))
    instances: 1
    memory: 512M
    disk_quota: 1G
    routes:
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/sse
      - route: forschungsintelligenz.com/sse
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/messages
      - route: forschungsintelligenz.com/messages
    command: python manage.py run_mcp --port 8000

  - name: sri-worker
    docker:
      image: ((backend_image))
      username: ((registry_username))
    instances: 2
    memory: 1536M
    disk_quota: 2G
    no-route: true
    health-check-type: process
    command: celery -A django_project worker --loglevel=info -Q celery,tenant-default,tenant-bulk-scraping --concurrency=4 --max-tasks-per-child=100 -O fair --prefetch-multiplier=1
    env:
      EXTRACTION_PARALLEL_WORKERS: "4"
      SCREENING_PARALLEL_WORKERS: "4"
      DOWNLOAD_PARALLEL_WORKERS: "4"
      OCR_PARALLEL_WORKERS: "4"


  - name: sri-beat
    docker:
      image: ((backend_image))
      username: ((registry_username))
    instances: 1
    memory: 256M
    disk_quota: 1G
    no-route: true
    health-check-type: process
    command: celery -A django_project beat --loglevel=info -s /tmp/celerybeat-schedule

  - name: sri-frontend
    docker:
      image: ((frontend_image))
      username: ((registry_username))
    instances: 1
    memory: 512M
    disk_quota: 1G
    routes:
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud
      - route: forschungsintelligenz.com
    env:
      BACKEND_INTERNAL_URL: https://sri-prod.apps.01.cf.eu01.onstackit.cloud
      SITE_URL: https://forschungsintelligenz.com






