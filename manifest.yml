---
applications:
  - name: sri-api
    docker:
      image: ((backend_image))
      username: ((registry_username))
    instances: 4
    memory: 2G
    disk_quota: 2G
    routes:
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/api
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/mcp
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/metrics
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/health
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/admin
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/docs
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/swagger
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/redoc
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/schema
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/static
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/media
      - route: research-scanner.schwarz/api
      - route: research-scanner.schwarz/mcp
      - route: research-scanner.schwarz/metrics
      - route: research-scanner.schwarz/health
      - route: research-scanner.schwarz/admin
      - route: research-scanner.schwarz/docs
      - route: research-scanner.schwarz/swagger
      - route: research-scanner.schwarz/redoc
      - route: research-scanner.schwarz/schema
      - route: research-scanner.schwarz/static
      - route: research-scanner.schwarz/media

    env:
      DEBUG: "False"
      ALLOWED_HOSTS: "sri-prod.apps.01.cf.eu01.onstackit.cloud,research-scanner.schwarz,sri.soinventive.co.uk,localhost"
      CSRF_TRUSTED_ORIGINS: "https://sri-prod.apps.01.cf.eu01.onstackit.cloud,https://research-scanner.schwarz,https://sri.soinventive.co.uk"

  - name: sri-mcp
    docker:
      image: ((backend_image))
      username: ((registry_username))
    instances: 1
    memory: 1G
    disk_quota: 2G
    routes:
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/sse
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud/messages
      - route: research-scanner.schwarz/sse
      - route: research-scanner.schwarz/messages
    command: exec python manage.py run_mcp --port 8000
    env:
      DEBUG: "False"
      ALLOWED_HOSTS: "sri-prod.apps.01.cf.eu01.onstackit.cloud,research-scanner.schwarz,sri.soinventive.co.uk,localhost"
      CSRF_TRUSTED_ORIGINS: "https://sri-prod.apps.01.cf.eu01.onstackit.cloud,https://research-scanner.schwarz,https://sri.soinventive.co.uk"

  - name: sri-worker
    docker:
      image: ((backend_image))
      username: ((registry_username))
    instances: 2
    memory: 3G
    disk_quota: 4G
    no-route: true
    health-check-type: process
    command: exec celery -A django_project worker --loglevel=info -Q celery,tenant-default,tenant-bulk-scraping --concurrency=2 --max-tasks-per-child=20 --max-memory-per-child=1200000 -O fair --prefetch-multiplier=1
    env:
      EXTRACTION_PARALLEL_WORKERS: "4"
      SCREENING_PARALLEL_WORKERS: "4"
      DOWNLOAD_PARALLEL_WORKERS: "4"
      OCR_PARALLEL_WORKERS: "4"
      REMAP_SIGTERM: SIGQUIT
      ALLOWED_HOSTS: "sri-prod.apps.01.cf.eu01.onstackit.cloud,research-scanner.schwarz,sri.soinventive.co.uk,localhost,127.0.0.1"

  - name: sri-beat
    docker:
      image: ((backend_image))
      username: ((registry_username))
    instances: 1
    memory: 256M
    disk_quota: 1G
    no-route: true
    health-check-type: process
    command: exec celery -A django_project beat --loglevel=info -s /tmp/celerybeat-schedule
    env:
      ALLOWED_HOSTS: "sri-prod.apps.01.cf.eu01.onstackit.cloud,research-scanner.schwarz,sri.soinventive.co.uk,localhost,127.0.0.1"

  - name: sri-frontend
    docker:
      image: ((frontend_image))
      username: ((registry_username))
    instances: 1
    memory: 512M
    disk_quota: 1G
    routes:
      - route: sri-prod.apps.01.cf.eu01.onstackit.cloud
      - route: research-scanner.schwarz
    env:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: https://sri-prod.apps.01.cf.eu01.onstackit.cloud
      SITE_URL: https://research-scanner.schwarz
      UV_THREADPOOL_SIZE: "64"






