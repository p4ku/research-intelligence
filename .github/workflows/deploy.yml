name: Deploy to STACKIT Cloud Foundry

on:
  push:
    branches:
      - main

env:
  REGISTRY: registry.onstackit.cloud
  REGISTRY_PROJECT: sri-production

  BACKEND_IMAGE: registry.onstackit.cloud/sri-production/sri-backend
  FRONTEND_IMAGE: registry.onstackit.cloud/sri-production/sri-frontend



jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Docker / Container Registry
      # ------------------------------------------------------------

      - name: Login to STACKIT Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ------------------------------------------------------------
      # Cloud Foundry
      # ------------------------------------------------------------

      - name: Install Cloud Foundry CLI
        run: |
          wget -q \
            https://packages.cloudfoundry.org/stable?release=linux64-binary \
            -O cf-cli.tgz

          tar -xzf cf-cli.tgz
          sudo mv cf8 /usr/local/bin/cf

          cf version

      - name: Login to Cloud Foundry
        run: |
          cf api "${{ secrets.CF_API }}"
          cf auth \
            "${{ secrets.CF_USERNAME }}" \
            "${{ secrets.CF_PASSWORD }}"

          cf target \
            -o "${{ secrets.CF_ORG }}" \
            -s "${{ secrets.CF_SPACE }}"

      # ------------------------------------------------------------
      # Generate vars file
      # ------------------------------------------------------------

      - name: Create Cloud Foundry vars file
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          cat > vars-ci.yml <<EOF
          backend_image: ${BACKEND_IMAGE}:${GITHUB_SHA}
          frontend_image: ${FRONTEND_IMAGE}:${GITHUB_SHA}
          registry_username: ${REGISTRY_USERNAME}
          EOF

      # ------------------------------------------------------------
      # Deploy
      # ------------------------------------------------------------

      - name: Deploy to Cloud Foundry
        env:
          CF_DOCKER_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          cf push \
            -f manifest.yml \
            --vars-file vars-ci.yml

      # ------------------------------------------------------------
      # Verify deployment
      # ------------------------------------------------------------

      - name: Show applications
        run: |
          cf apps

