name: Deploy to STACKIT Cloud Foundry

on:
  push:
    branches:
      - main

env:
  REGISTRY: registry.onstackit.cloud
  REGISTRY_PROJECT: sri-production
  BACKEND_IMAGE: registry.onstackit.cloud/sri-production/sri-backend
  FRONTEND_IMAGE: registry.onstackit.cloud/sri-production/sri-frontend

jobs:
  # ============================================================
  # PARALLEL BUILD 1: Backend Container (Django / Celery / FastMCP)
  # ============================================================
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history: the frontend version is the count of commits that
          # touched frontend/, which a shallow clone would report as 1.
          fetch-depth: 0

      # 0.1.<n> — major.minor from frontend/package.json, n = commits that
      # touched frontend/. Shown under the sidebar wordmark and by /bff/status.
      - name: Resolve frontend version
        id: frontend
        run: echo "version=$(node frontend/scripts/app-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Login to STACKIT Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=min,scope=backend

  # ============================================================
  # PARALLEL BUILD 2: Frontend Container (Next.js Standalone / Bun)
  # ============================================================
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to STACKIT Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          build-args: |
            BUILD_ID=${{ github.sha }}
            APP_VERSION=${{ steps.frontend.outputs.version }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:v${{ steps.frontend.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=min,scope=frontend

  # ============================================================
  # DEPLOYMENT: STACKIT Cloud Foundry
  # ============================================================
  deploy:
    name: Deploy to Cloud Foundry
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cloud Foundry CLI
        run: |
          wget -q https://packages.cloudfoundry.org/stable?release=linux64-binary -O cf-cli.tgz
          tar -xzf cf-cli.tgz
          sudo mv cf8 /usr/local/bin/cf
          cf version

      - name: Authenticate with Cloud Foundry
        run: |
          cf api "${{ secrets.CF_API }}"
          cf auth "${{ secrets.CF_USERNAME }}" "${{ secrets.CF_PASSWORD }}"
          cf target -o "${{ secrets.CF_ORG }}" -s "${{ secrets.CF_SPACE }}"

      - name: Create Cloud Foundry vars file
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          cat > vars-ci.yml <<EOF
          backend_image: ${BACKEND_IMAGE}:${GITHUB_SHA}
          frontend_image: ${FRONTEND_IMAGE}:${GITHUB_SHA}
          registry_username: ${REGISTRY_USERNAME}
          EOF

      - name: Deploy to Cloud Foundry
        env:
          CF_DOCKER_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          cf push -f manifest.yml --vars-file vars-ci.yml

      - name: Verify Running Applications
        run: |
          cf apps
