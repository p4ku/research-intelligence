name: CI - Test Suite & Docker Build Cache

on:
  push:
    branches: [ main, master, 'feature/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend-sqlite:
    name: Run Django Unit Tests (SQLite In-Memory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django Tests (SQLite Parallel)
        env:
          DEBUG: 'True'
          SECRET_KEY: 'ci_secret_key_testing_12345'
          GOOGLE_AGENT_API_KEY: 'mock_key_for_testing'
        run: |
          ./backend/run_tests.sh

  check-frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Version comes from "packageManager" in frontend/package.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Cache Bun Install Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The same steps as `bun run check`, minus scope:check (a branch's
      # provenance is a local concern), plus the build.
      - name: Format
        run: bun run format:check

      - name: Types
        run: bun run typecheck

      - name: Lint and Contract
        run: bun run lint

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

  docker-cache-build:
    name: Build & Cache Docker Container Layers
    runs-on: ubuntu-latest
    needs: test-backend-sqlite

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Backend Image with Layer Cache
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: research-intelligence-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
