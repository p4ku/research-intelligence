---
# Cloud Foundry Manifest for Development Environment
applications:

  # 1. Django REST API Backend
  - name: ri-dev-backend
    memory: 1G
    instances: 1
    disk_quota: 1G
    buildpacks:
      - python_buildpack
    path: ../backend
    command: python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn django_project.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2
    random-route: true
    services:
      - ri-dev-postgres-service
      - ri-dev-redis-service
      - ri-dev-storage-service
    env:
      DEBUG: "False"
      SECRET_KEY: "dev-secret-key-to-be-overwritten-in-ci"
      ALLOWED_HOSTS: "*"
      STORAGE_BACKEND: "s3"
      GOOGLE_AGENT_API_KEY: "dev-google-agent-api-key"
      GOOGLE_AGENT_API_URL: "https://api.schwarzdigits.cloud/v1/google-agents"

  # 2. Celery Worker (Asynchronous Task Queue Processing)
  - name: ri-dev-celery-worker
    memory: 1G
    instances: 1
    disk_quota: 1G
    no-route: true
    buildpacks:
      - python_buildpack
    path: ../backend
    command: celery -A django_project worker --loglevel=info -Q tenant-default,tenant-bulk-scraping
    services:
      - ri-dev-postgres-service
      - ri-dev-redis-service
      - ri-dev-storage-service
    env:
      DEBUG: "False"
      SECRET_KEY: "dev-secret-key-to-be-overwritten-in-ci"
      STORAGE_BACKEND: "s3"
      GOOGLE_AGENT_API_KEY: "dev-google-agent-api-key"

  # 3. Celery Beat Scheduler (Timed Tasks Trigger)
  - name: ri-dev-celery-beat
    memory: 512M
    instances: 1 # Must be strictly 1 to prevent duplicate tasks
    disk_quota: 512M
    no-route: true
    buildpacks:
      - python_buildpack
    path: ../backend
    command: rm -f celerybeat.pid && celery -A django_project beat --loglevel=info
    services:
      - ri-dev-postgres-service
      - ri-dev-redis-service
    env:
      DEBUG: "False"
      SECRET_KEY: "dev-secret-key-to-be-overwritten-in-ci"

  # 4. Next.js Frontend Dashboard (React app)
  - name: ri-dev-frontend
    memory: 512M
    instances: 1
    disk_quota: 512M
    docker:
      image: registry.eu01.onstackit.cloud/research-intelligence/frontend:dev
    random-route: true
    env:
      PORT: "8080"
      BACKEND_URL: "https://ri-dev-backend.apps.eu01.onstackit.cloud"
