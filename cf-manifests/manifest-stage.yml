---
# Cloud Foundry Manifest for Staging Environment
applications:

  # 1. Django REST API Backend
  - name: ri-stage-backend
    memory: 2G
    instances: 2
    disk_quota: 2G
    buildpacks:
      - python_buildpack
    path: ../backend
    command: python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn django_project.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 3
    routes:
      - route: ri-stage-backend.apps.eu01.onstackit.cloud
    services:
      - ri-stage-postgres-service
      - ri-stage-redis-service
      - ri-stage-storage-service
    env:
      DEBUG: "False"
      SECRET_KEY: "stage-secret-key-to-be-overwritten-in-ci"
      ALLOWED_HOSTS: "*"
      STORAGE_BACKEND: "s3"
      GOOGLE_AGENT_API_KEY: "stage-google-agent-api-key"
      GOOGLE_AGENT_API_URL: "https://api.schwarzdigits.cloud/v1/google-agents"

  # 2. Celery Worker (Asynchronous Task Queue Processing)
  - name: ri-stage-celery-worker
    memory: 2G
    instances: 2
    disk_quota: 2G
    no-route: true
    buildpacks:
      - python_buildpack
    path: ../backend
    command: celery -A django_project worker --loglevel=info -Q tenant-default,tenant-bulk-scraping
    services:
      - ri-stage-postgres-service
      - ri-stage-redis-service
      - ri-stage-storage-service
    env:
      DEBUG: "False"
      SECRET_KEY: "stage-secret-key-to-be-overwritten-in-ci"
      STORAGE_BACKEND: "s3"
      GOOGLE_AGENT_API_KEY: "stage-google-agent-api-key"

  # 3. Celery Beat Scheduler (Timed Tasks Trigger)
  - name: ri-stage-celery-beat
    memory: 512M
    instances: 1
    disk_quota: 512M
    no-route: true
    buildpacks:
      - python_buildpack
    path: ../backend
    command: rm -f celerybeat.pid && celery -A django_project beat --loglevel=info
    services:
      - ri-stage-postgres-service
      - ri-stage-redis-service
    env:
      DEBUG: "False"
      SECRET_KEY: "stage-secret-key-to-be-overwritten-in-ci"

  # 4. Next.js Frontend Dashboard (React app)
  - name: ri-stage-frontend
    memory: 1G
    instances: 2
    disk_quota: 1G
    docker:
      image: registry.eu01.onstackit.cloud/research-intelligence/frontend:stage
    routes:
      - route: ri-stage-frontend.apps.eu01.onstackit.cloud
    env:
      PORT: "8080"
      BACKEND_URL: "https://ri-stage-backend.apps.eu01.onstackit.cloud"
